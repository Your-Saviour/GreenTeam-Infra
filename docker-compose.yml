services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.gt.blueteam.au`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$2y$$05$$gxakRHt5HcGQM3I3mJJvEuq9r4as6J4TQEp1gldCpzoNkF689b4iu"
      # Redirect the apex domain to Homarr, preserving the path and query string.
      - "traefik.http.routers.blueteam-root.rule=Host(`blueteam.au`)"
      - "traefik.http.routers.blueteam-root.entrypoints=websecure"
      - "traefik.http.routers.blueteam-root.tls.certresolver=letsencrypt"
      - "traefik.http.routers.blueteam-root.service=noop@internal"
      - "traefik.http.routers.blueteam-root.middlewares=blueteam-root-redirect"
      - "traefik.http.middlewares.blueteam-root-redirect.redirectregex.regex=^https?://blueteam[.]au(:[0-9]+)?/(.*)"
      - "traefik.http.middlewares.blueteam-root-redirect.redirectregex.replacement=https://home.blueteam.au/$${2}"
      - "traefik.http.middlewares.blueteam-root-redirect.redirectregex.permanent=true"
    networks:
      proxy:
        aliases:
          - auth.blueteam.au
          - home.blueteam.au

  dockhand:
    image: fnsys/dockhand:v1.0.56
    container_name: dockhand
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockhand.rule=Host(`dockhand.gt.blueteam.au`)"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.http.routers.dockhand.tls.certresolver=letsencrypt"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
    depends_on:
      - traefik
    networks:
      - proxy

volumes:
  letsencrypt:
  dockhand_data:

networks:
  proxy:
    name: proxy
