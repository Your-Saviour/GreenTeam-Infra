version: 1
metadata:
  name: BlueTeam branding
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      branding_title: BlueTeam Identity
      branding_logo: /media/blueteam-logo.png
      branding_favicon: /media/blueteam-favicon.png
      branding_custom_css: |
        :root {
          --ak-accent: #2563eb;
          --ak-accent-bright: #22d3ee;
          --pf-global--primary-color--100: #2563eb;
          --pf-global--primary-color--200: #1d4ed8;
          --pf-global--link--Color: #2563eb;
          --pf-global--link--Color--hover: #1d4ed8;
          --pf-v5-global--primary-color--100: #2563eb;
          --pf-v5-global--primary-color--200: #1d4ed8;
          --pf-v5-global--link--Color: #2563eb;
          --pf-v5-global--link--Color--hover: #1d4ed8;
        }

        .pf-c-background-image,
        .pf-v5-c-background-image {
          background-color: #07152f;
          background-image:
            radial-gradient(circle at 18% 18%, rgb(34 211 238 / 18%), transparent 32rem),
            radial-gradient(circle at 82% 78%, rgb(37 99 235 / 24%), transparent 36rem),
            linear-gradient(145deg, #07152f 0%, #0b2148 55%, #102f62 100%);
        }

        .pf-c-login__main,
        .pf-v5-c-login__main {
          border: 1px solid rgb(148 163 184 / 25%);
          border-radius: 1rem;
          box-shadow: 0 1.5rem 4rem rgb(2 8 23 / 45%);
          overflow: hidden;
        }

        .pf-c-button.pf-m-primary,
        .pf-v5-c-button.pf-m-primary {
          background: linear-gradient(135deg, #2563eb, #1d4ed8);
          border-radius: 0.5rem;
        }

        .pf-c-button.pf-m-primary:hover,
        .pf-v5-c-button.pf-m-primary:hover {
          background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        .ak-brand img {
          max-block-size: 5rem;
        }

        :focus-visible {
          outline: 3px solid #22d3ee;
          outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            scroll-behavior: auto !important;
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
          }
        }
      attributes:
        settings:
          locale: en
